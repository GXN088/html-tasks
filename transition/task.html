<!DOCTYPE html>
<html>
<head>
<style>
/* Write your CSS here */
.card {
  background-color: white;
  padding: 10px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  /* Добавляем плавный переход для фона и тени */
  transition: background-color 0.4s ease, box-shadow 0.4s ease;
}

/* Эффект при наведении, чтобы проверить работу анимации */
.card:hover {
  background-color: #f0f0f0;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}
</style>
</head>
<body>
<div class="card">
  Hover over me!
</div>
</body>
</html>
