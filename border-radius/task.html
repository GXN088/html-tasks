<!DOCTYPE html>
<html>
<head>
<title>Tooltips</title>
<style>
.tooltip-container {
  position: relative;
  display: inline-block;
  margin: 50px;
}

button {
  padding: 8px 16px;
  cursor: pointer;
}

.tooltip {
  /* 1. Скрываем подсказку по умолчанию */
  visibility: hidden; 
  opacity: 0;
  transition: opacity 0.3s;
  
  /* Позиционирование подсказки под кнопкой */
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-top: 8px;
  white-space: nowrap;

  /* 2. Добавляем цвет фона и цвет текста */
  background-color: #333333;
  color: #ffffff;

  /* 3. Центрируем текст внутри подсказки */
  text-align: center;

  /* 4. Добавляем внутренние отступы (padding) */
  padding: 6px 12px;

  /* 5. Закругляем углы */
  border-radius: 4px;
}

/* Show the tooltip when hovering over the container */
.tooltip-container:hover .tooltip {
  visibility: visible;
  opacity: 1;
}
</style>
</head>
<body>

<div class="tooltip-container">
  <button>Help</button>
  <span class="tooltip">Click for assistance</span>
</div>

</body>
</html>
