<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      display: grid;
      grid-template-columns: 1fr 3fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "header header"
        "profile main"
        "footer footer";
      height: 100vh;
      gap: 10px;
    }
    
    .header {
      grid-area: header;
      background-color: #f1c40f;
      padding: 20px;
    }
    
    .profile {
      grid-area: profile;
      background-color: #3498db;
      padding: 20px;
    }
    
    .main {
      grid-area: main;
      background-color: #2ecc71;
      padding: 20px;
    }
    
    .footer {
      grid-area: footer;
      background-color: #e74c3c;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Header</div>
    <div class="profile">Profile</div>
    <div class="main">Main Content</div>
    <div class="footer">Footer</div>
  </div>
</body>
</html>
