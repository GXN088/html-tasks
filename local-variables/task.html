<!DOCTYPE html>
<html>
<head>
    <title>Local Variables</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <style>
        /* Global variable for body background */
        :root {
            --body-bg: #000f26;
            --font-family: 'Playfair Display', serif;
        }

        body {
            background-color: var(--body-bg);
            font-family: var(--font-family);
            padding: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        /* Card styles */
        .card {
            --card-accent: coral; /* 1. `.card` 内にローカル変数を作成 */
            --card-bg: white;
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            width: 250px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-top: 0;
            color: var(--card-accent); /* 2. 変数をh3のテキスト色に適用 */
        }

        .card p {
            font-size: 0.9rem;
            color: #333;
        }

        .card button {
            background-color: var(--card-accent); /* 3. 同じ変数をボタンの背景色に適用 */
            border: none;
            color: #000f26;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>Classic Sneakers</h3>
        <p>Comfortable and stylish sneakers for everyday wear</p>
        <button>Buy Now</button>
    </div>

    <!-- specialクラスを持つカード -->
    <div class="card special">
        <h3>Luxury Watch</h3>
        <p>Elegant watch with a unique design for special occasions</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <h3>Leather Backpack</h3>
        <p>Durable spacious backpack made from premium leather</p>
        <button>Buy Now</button>
    </div>

</body>
</html>
